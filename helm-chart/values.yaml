replicaCount: 2

image:
  repository: ghcr.io/ovoscan/api
  pullPolicy: IfNotPresent
  tag: latest

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: nginx
  host: ovoscan.example.com
  tls: true

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2
    memory: 2Gi

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilization: 70
  targetMemoryUtilization: 80

env:
  APP_NAME: ovoscan
  APP_ENV: production
  APP_LOG_LEVEL: INFO
  CONFIDENCE_THRESHOLD: "0.25"
  ENABLE_RAG: "true"
  ENABLE_METRICS: "true"
  MLFLOW_TRACKING_URI: http://mlflow-service:5000
  OLLAMA_HOST: http://ollama-service:11434
  OLLAMA_MODEL: llama3.2

persistence:
  enabled: true
  size: 10Gi
  accessMode: ReadWriteOnce

streamlit:
  enabled: true
  port: 8501
  replicas: 1