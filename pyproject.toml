[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovoscan-pipeline"
version = "1.0.0"
description = "Production-grade computer vision pipeline for automated visual inspection in manufacturing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Khaled Saifullah", email = "ksnishaat@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "zenml>=0.80.0",
    "ultralytics>=8.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "minio>=7.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "streamlit>=1.30.0",
    "pyyaml>=6.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "langchain-chroma>=0.1.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "pypdf>=4.0.0",
    "ollama>=0.1.0",
    "prometheus-client>=0.20.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "torch",
    "pillow",
    "opencv-python-headless",
    "dash",
    "dash-bootstrap-components",
    "plotly",
    "langchain-core",
    "langchain-text-splitters",
    "python-json-logger",
    "requests",
    "python-multipart",
    "typing-extensions",
    "httpx",
    "slowapi==0.1.10",
    "tenacity>=8.1,<9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
ovoscan-api = "src.app:app"
ovoscan-dashboard = "src.dash_app.app:app"
ovoscan-train = "src.pipelines.training_pipeline:ovoscan_training_pipeline"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Notebooks re-import the same names in each cell, which is normal in Jupyter
# but trips F811. They are not linted.
extend-exclude = ["notebooks", ".ipynb_checkpoints"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
# B008: FastAPI requires File(...)/Depends(...) in argument defaults.
# C408: dict() calls in Dash layout definitions are intentional.
# UP035/UP045: the Airflow image runs Python 3.8, where typing.Annotated
# and PEP 604 unions do not exist, so the typing_extensions backport and
# Optional[...] are required.
# UP006/UP035/UP045: the Airflow image runs Python 3.8, where PEP 585
# builtin generics (list[str], tuple[...]) and PEP 604 unions raise
# TypeError at runtime, so the typing.List/Tuple/Optional forms are
# required rather than merely stylistic.
ignore = ["E501", "B008", "C408", "UP006", "UP035", "UP045"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: requires the live docker stack (set LIVE_STACK=1)",
]

# --- uv -------------------------------------------------------------------
# uv is the resolver and installer for this project. `uv sync` installs the
# locked set; `uv lock` regenerates it. The CPU wheel index is declared here
# because PEP 508 has no syntax for an index URL, which is why the serving
# image previously needed a separate requirements-serve.txt.
[tool.uv]
# The default PyPI index plus the CPU-only torch wheels. `unsafe-best-match`
# lets uv consider both indexes for the same package, which is required for
# torch: PyPI carries the CUDA build, the pytorch index carries +cpu.
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = false

[tool.uv.sources]
# Pin torch and torchvision to the CPU index so a serving install never pulls
# the 3.2 GB of nvidia wheels that the default PyPI build drags in.
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
