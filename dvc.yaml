# DVC Pipeline for OvoScan
# Bronze -> Silver -> Train
#
# Every stage below references a script that exists in this repository and
# declares outputs that the script actually produces. Run the whole pipeline
# with `dvc repro`, or a single stage with `dvc repro <stage>`.
#
# The raw dataset is not committed. Fetch it first (see the README) and place
# it at data/raw, or pass a different --source.
stages:
  # === BRONZE LAYER: raw images copied into a versioned layer ===
  extract_bronze:
    desc: Copy raw images into the bronze layer, preserving class folders.
    cmd: python src/scripts/extract_bronze.py --source data/raw --output data/bronze
    deps:
      - src/scripts/extract_bronze.py
    outs:
      - data/bronze

  # === BRONZE -> SILVER: resize and normalise ===
  preprocess_silver:
    desc: Resize and normalise bronze images into the silver layer.
    cmd: python src/scripts/preprocess_silver.py --input data/bronze --output data/silver --img-size 224
    deps:
      - src/scripts/preprocess_silver.py
      - data/bronze
    outs:
      - data/silver

  # === TRAIN: YOLOv8 classification on the silver layer ===
  train_yolo:
    desc: Train the YOLOv8 classification model on the silver layer.
    cmd: python -c "from ultralytics import YOLO; m = YOLO('yolov8n-cls.pt'); m.train(data='data/silver', epochs=${training.epochs}, imgsz=224, batch=${training.batch_size})"
    deps:
      - data/silver
    params:
      - training.epochs
      - training.batch_size
    outs:
      - runs/classify
