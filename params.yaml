# DVC Parameters for OvoScan
training:
  epochs: 200
  batch_size: 32
  learning_rate: 0.001
  img_size: 640
  optimizer: adamw
  weight_decay: 0.0005
  mosaic: 1.0
  mixup: 0.0

preprocessing:
  image_size: [640, 640]
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]
  augmentation:
    hsv_h: 0.015
    hsv_s: 0.7
    hsv_v: 0.4
    flipud: 0.0
    fliplr: 0.5
    mosaic: 1.0
    mixup: 0.0

gold:
  train_split: 0.7
  val_split: 0.2
  test_split: 0.1
  classes:
    0: ok
    1: cracked
    2: chipped
    3: misplaced
    4: stained

quality:
  defect_types:
    - crack
    - scratch
    - dent
    - corrosion
    - contamination
  severity_levels:
    - critical
    - major
    - minor
    - ok