version: '3.8'

services:
  # ==========================================
  # 1. OLLAMA (LLM Service) - GPU Support
  # ==========================================
  ollama:
    image: ollama/ollama:latest
    container_name: ovoscan_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - ovoscan-network

  # ==========================================
  # 2. API (FastAPI with YOLOv8)
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: ovoscan_api
    command: uvicorn src.app:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    volumes:
      - ./serving:/app/serving
      - ./data:/app/data
      - ./models:/app/models
      - ovoscan_dvc:/app/.dvc
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
      - CONFIDENCE_THRESHOLD=0.25
      - ENABLE_RAG=true
      - ENABLE_METRICS=true
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONUNBUFFERED=1
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      # The root path is the health endpoint; /health returns 404.
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - ovoscan-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ==========================================
  # 3. DASHBOARD (Plotly Dash - Modern Enterprise UI)
  # ==========================================
  dash:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: ovoscan_dash
    command: python -m src.dash_app.app
    ports:
      - "8050:8050"
    volumes:
      - ./src:/app/src
    environment:
      - API_URL=http://api:8000
      - DASH_PORT=8050
      - DASH_DEBUG=false
      - PYTHONUNBUFFERED=1
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8050/_dash-health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - ovoscan-network

  # ==========================================
  # 4. LEGACY FRONTEND (Streamlit)
  # ==========================================
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: ovoscan_streamlit
    command: streamlit run src/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
    environment:
      - API_URL=http://api:8000
      - PYTHONUNBUFFERED=1
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - ovoscan-network

  # ==========================================
  # 5. MLflow (Experiment Tracking)
  # ==========================================
  mlflow:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.mlflow
    container_name: ovoscan_mlflow
    ports:
      - "5000:5000"
    environment:
      - BACKEND_STORE_URI=sqlite:///mlflow.db
      - DEFAULT_ARTIFACT_ROOT=/mlruns
    volumes:
      - mlflow_data:/mlruns
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - ovoscan-network

  # ==========================================
  # 6. MONITORING (Prometheus + Grafana)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: ovoscan_prometheus
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # Retention and WAL compression are CLI-only options, not
      # config-file fields, so they are set here.
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.wal-compression'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - ovoscan-network

  grafana:
    image: grafana/grafana:latest
    container_name: ovoscan_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=ovoscan
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - ovoscan-network

  # ==========================================
  # 8. ORCHESTRATION (Airflow)
  # ==========================================
  # Postgres is Airflow's metadata database. It is separate from any
  # application database: Airflow needs its own schema and migrations.
  airflow-postgres:
    image: postgres:15
    container_name: ovoscan_airflow_postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ovoscan-network

  airflow-webserver:
    image: ovoscan-airflow:latest
    container_name: ovoscan_airflow_webserver
    user: "${AIRFLOW_UID:-1000}:0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.airflow
    restart: unless-stopped
    environment:
      # LocalExecutor cannot use SQLite, so Postgres is required.
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      # MLflow runs on the host (port 5000), not as a compose service, so the
      # container reaches it through the Docker gateway rather than by name.
      - MLFLOW_TRACKING_URI=http://host.docker.internal:5000
      - OVOSCAN_SRC=/opt/airflow/src
      - OVOSCAN_DATA_DIR=/opt/airflow/dataset/train
      - OVOSCAN_MODEL_DIR=/opt/airflow/models
      # The Airflow image is CPU-only so retraining does not contend with
      # the serving container for the GPU.
      - OVOSCAN_DEVICE=cpu
    volumes:
      - ./dags:/opt/airflow/dags
      # Mount src OUTSIDE the dags directory. Airflow scans everything under
      # /opt/airflow/dags for DAG files, so mounting src there makes it try to
      # parse every project module as a DAG and report import errors.
      - ./src:/opt/airflow/src
      # The dataset uses the YOLO images/+labels/ layout, so the split directory
      # is mounted as-is rather than flattened.
      - ./egg_dataset:/opt/airflow/dataset
      # Named volume, not a bind mount: a host ./logs directory owned by root is
      # not writable by the airflow user and Airflow fails to start.
      - airflow_logs:/opt/airflow/logs
      # Training exports the retrained weights here. ./src is a read-only bind
      # mount, so the exports need their own writable volume.
      - airflow_models:/opt/airflow/models
      # The serving checkpoint. The API loads MODEL_PATH=serving/model.pt, so
      # the training step must be able to write there; without this mount the
      # retrain succeeds and the API keeps serving the old weights.
      - ./serving:/opt/airflow/serving
    ports:
      - "8084:8080"
    command: webserver
    depends_on:
      airflow-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ovoscan-network

  airflow-scheduler:
    image: ovoscan-airflow:latest
    container_name: ovoscan_airflow_scheduler
    user: "${AIRFLOW_UID:-1000}:0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.airflow
    restart: unless-stopped
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - MLFLOW_TRACKING_URI=http://host.docker.internal:5000
      - OVOSCAN_SRC=/opt/airflow/src
      - OVOSCAN_DATA_DIR=/opt/airflow/dataset/train
      - OVOSCAN_MODEL_DIR=/opt/airflow/models
      # The Airflow image is CPU-only so retraining does not contend with
      # the serving container for the GPU.
      - OVOSCAN_DEVICE=cpu
      # The retraining DAG calls /admin/reload-model and /monitoring, both of
      # which enforce X-API-Key. Without this the DAG got a 401 and failed.
      # Must match the API_KEY the serving API was started with.
      - API_KEY=${API_KEY:-demo-secret-key}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./egg_dataset:/opt/airflow/dataset
      - airflow_logs:/opt/airflow/logs
      - airflow_models:/opt/airflow/models
      # The serving checkpoint. The API loads MODEL_PATH=serving/model.pt, so
      # the training step must be able to write there; without this mount the
      # retrain succeeds and the API keeps serving the old weights.
      - ./serving:/opt/airflow/serving
    command: scheduler
    depends_on:
      - airflow-webserver
    networks:
      - ovoscan-network

networks:
  ovoscan-network:
    driver: bridge

volumes:
  ollama_storage:
  ovoscan_dvc:
  mlflow_data:
  prometheus_data:
  grafana_data:
  airflow_postgres_data:
  airflow_logs:
  airflow_models:
